<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brainbolt – Quiz Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1340;--ink2:#2A1F5E;--violet:#6C4DFF;--sun:#FFC857;--mint:#3DDBA8;--rose:#FF5C7A;--cloud:#F3F0FF;--mut:#B7AEE0;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,sans-serif;color:var(--cloud);background:radial-gradient(circle at 15% 0,#41309c,transparent 55%),radial-gradient(circle at 90% 100%,#5a2a8f55,transparent 50%),var(--ink);min-height:100vh;overflow-x:hidden}
h1,h2,h3,.logo,.big{font-family:'Bricolage Grotesque',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.fl{position:fixed;font-size:2.4rem;opacity:.1;pointer-events:none;animation:float 14s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-40px) rotate(14deg)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--line);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;background:#1b134099}
.logo{font-weight:800;font-size:1.4rem}
.who{display:flex;align-items:center;gap:10px}
.chip{font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--violet)}
.chip.questioner{background:var(--sun);color:#3b2a00}.chip.player{background:var(--mint);color:#06382a}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px;position:relative}
.card{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px;backdrop-filter:blur(8px)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
h2{font-size:1.5rem;margin-bottom:14px}h3{font-size:1.1rem;margin-bottom:10px}
label{display:block;font-size:.88rem;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(10,6,40,.55)}
select option{color:#000}
textarea{min-height:80px;resize:vertical}
.btn{margin-top:16px;padding:12px 22px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--violet),#9b6bff);font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px #6c4dff77}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer}.ghost:hover{background:var(--line)}
.danger{color:var(--rose)}
.muted{color:var(--mut);font-size:.9rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border:0}
.row select{width:auto}
/* login: the one orchestrated entrance */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(420px,100%);animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both}
.login h1{font-size:2.6rem;line-height:1.05}
.bolt{display:inline-block;animation:zap 2.4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.94)}}
@keyframes zap{0%,60%,100%{transform:none}70%{transform:scale(1.3) rotate(-12deg)}80%{transform:scale(1) rotate(8deg)}}
/* points coin */
.hero{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.coin{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#fff3b8,var(--sun) 55%,#e39a14);color:#3b2a00;box-shadow:0 0 0 6px #ffc85733,0 12px 34px #ffc85766;animation:spin 6s ease-in-out infinite}
.coin b{font-size:2.8rem}
@keyframes spin{0%,70%{transform:rotateY(0)}85%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.stats{display:flex;gap:26px;flex-wrap:wrap}.stats b{display:block;font-size:1.7rem}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{padding:9px 18px;border-radius:99px;border:1px solid var(--line);background:none;cursor:pointer}
.tabs .on{background:var(--violet);border-color:var(--violet)}
/* question */
.q{font-size:1.35rem;margin-bottom:16px;font-family:'Bricolage Grotesque',sans-serif}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(10,6,40,.4);cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.opt:hover:not(:disabled){transform:translateX(6px);border-color:var(--violet)}
.opt i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);flex:none;font-weight:600}
.opt.on{border-color:var(--sun);background:#ffc8571f}
.opt.ok{border-color:var(--mint);background:#3ddba826}.opt.bad{border-color:var(--rose);background:#ff5c7a26;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.result{animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.star{position:fixed;left:50%;top:40%;font-size:1.6rem;pointer-events:none;z-index:20;animation:burst 1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--rose);padding:11px 20px;border-radius:12px;z-index:30;animation:pop .3s}
.rank{width:28px;height:28px;border-radius:50%;background:var(--sun);color:#3b2a00;display:inline-grid;place-items:center;font-weight:700;font-size:.85rem;margin-right:10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<span class="fl" style="left:6%;top:18%">?</span><span class="fl" style="right:8%;top:30%;animation-delay:-4s">★</span>
<span class="fl" style="left:12%;bottom:12%;animation-delay:-8s">⚡</span><span class="fl" style="right:14%;bottom:18%;animation-delay:-2s">?</span>
<div id="app"></div>

<script>
// ── DATA STORAGE ───────────────────────────────────────────────────────
// Data is stored in your Firebase Realtime Database (brainbolt-605ba) under the node "quizArena".
// On the very first load, if the database has no users, one default admin is created automatically:
//   username: admin   password: admin123   (change it after your first login)
const DB_URL = "https://brainbolt-605ba-default-rtdb.firebaseio.com";
const KEY = "quizArena";

let S = { users: [], questions: [], answers: [] };
let me = null, tab = "new", sel = null, last = null, busy = false, counted = false;
const ROLE = { admin: "Admin", questioner: "Questioner", player: "Player" };
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function hash(p) {
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("qa:" + p));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
  }
  let h = 5381; for (const c of "qa:" + p) h = (h * 33) ^ c.charCodeAt(0);
  return "s" + (h >>> 0);
}
// storage that never crashes (some browsers/iframes block localStorage)
const mem = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
};
const ses = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return mem["s_" + k] ?? null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { mem["s_" + k] = v; } },
  del(k) { try { sessionStorage.removeItem(k); } catch (e) { delete mem["s_" + k]; } }
};
const dbUrl = () => DB_URL.replace(/\/$/, "") + "/" + KEY + ".json";
async function load() {
  try {
    let d;
    if (DB_URL) {
      const r = await fetch(dbUrl());
      d = await r.json();
      if (!r.ok || (d && d.error)) throw new Error((d && d.error) || "HTTP " + r.status);
    } else d = JSON.parse(store.get(KEY) || "null");
    if (d) S = { users: d.users || [], questions: d.questions || [], answers: d.answers || [] };
    return true;
  } catch (e) { toast("Could not load data: " + e.message); return false; }
}
async function save() {
  try {
    if (DB_URL) {
      const r = await fetch(dbUrl(), { method: "PUT", body: JSON.stringify(S) });
      if (!r.ok) throw new Error((await r.text()).slice(0, 80) || "HTTP " + r.status);
    } else store.set(KEY, JSON.stringify(S));
  } catch (e) { toast("Could not save: " + e.message); }
}
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); }

// ── HELPERS ────────────────────────────────────────────────────────────
const points = id => S.answers.filter(a => a.uid === id && a.ok).length;
const nextQ = () => S.questions.find(q => !S.answers.some(a => a.uid === me.id && a.qid === q.id));
const uname = id => (S.users.find(u => u.id === id) || { name: "Deleted user" }).name;

// ── VIEWS ──────────────────────────────────────────────────────────────
function render() {
  if (me) me = S.users.find(u => u.id === me.id) || null;
  $("#app").innerHTML = me ? appView() : loginView();
  if (me && me.role === "player") countUp();
}
function loginView() {
  return `<div class="login"><form class="card" onsubmit="login(event)">
    <h1><span class="bolt">⚡</span> Brainbolt</h1>
    <p class="muted" style="margin-top:6px">Answer questions. Earn points. Climb the board.</p>
    <label for="lu">Username</label><input id="lu" autocomplete="username" required>
    <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
    <button class="btn" style="width:100%">Log in</button></form></div>`;
}
function appView() {
  const body = me.role === "admin" ? admin() : me.role === "questioner" ? quest() : player();
  return `<header class="top"><div class="logo">⚡ Brainbolt</div><div class="who"><span>${esc(me.name)}</span><b class="chip ${me.role}">${ROLE[me.role]}</b><button class="ghost" onclick="logout()">Log out</button></div></header><main class="wrap">${body}</main>`;
}
function board() {
  const p = S.users.filter(u => u.role === "player").sort((a, b) => points(b.id) - points(a.id));
  return `<div class="card"><h3>Leaderboard</h3>${p.length ? p.map((u, i) => `<div class="row"><span><span class="rank">${i + 1}</span>${esc(u.name)}</span><b>${points(u.id)} pts</b></div>`).join("") : '<p class="muted">No players yet.</p>'}</div>`;
}
// Admin
function admin() {
  return `<div class="grid"><form class="card" onsubmit="addUser(event)"><h2>Create a user</h2>
    <label for="un">Full name</label><input id="un" required>
    <label for="uu">Username</label><input id="uu" required autocomplete="off">
    <label for="up">Password</label><input id="up" type="text" minlength="4" required autocomplete="off">
    <label for="ur">Role</label><select id="ur"><option value="player">Player (answers questions)</option><option value="questioner">Questioner (creates questions)</option><option value="admin">Admin</option></select>
    <button class="btn">Create user</button></form>
    <div class="card"><h2>All users (${S.users.length})</h2>${S.users.map(u => `<div class="row"><span>${esc(u.name)}<br><span class="muted">@${esc(u.username)}</span></span>
      <span><select aria-label="Role for ${esc(u.name)}" onchange="setRole('${u.id}',this.value)">${Object.keys(ROLE).map(r => `<option value="${r}" ${u.role === r ? "selected" : ""}>${ROLE[r]}</option>`).join("")}</select>
      ${u.id !== me.id ? `<button class="ghost danger" onclick="delUser('${u.id}')">Delete</button>` : ""}</span></div>`).join("")}</div></div>${board()}`;
}
// Questioner
function quest() {
  const mine = S.questions.filter(q => q.by === me.id);
  return `<div class="grid"><form class="card" onsubmit="addQ(event)"><h2>Write a question</h2>
    <label for="qt">Question</label><textarea id="qt" required></textarea>
    ${[0, 1, 2, 3].map(i => `<label for="o${i}">Option ${"ABCD"[i]}</label><input id="o${i}" required>`).join("")}
    <label for="qa">Correct answer</label><select id="qa"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
    <button class="btn">Publish question</button></form>
    <div class="card"><h2>Your questions (${mine.length})</h2>${mine.length ? mine.map(q => {
      const a = S.answers.filter(x => x.qid === q.id);
      return `<div class="row"><span>${esc(q.text)}<br><span class="muted">${a.length} answered · ${a.filter(x => x.ok).length} correct</span></span><button class="ghost danger" onclick="delQ('${q.id}')">Delete</button></div>`;
    }).join("") : '<p class="muted">You have not published any questions yet. Write your first one.</p>'}</div></div>`;
}
// Player
function player() {
  const mine = S.answers.filter(a => a.uid === me.id), right = mine.filter(a => a.ok).length;
  const acc = mine.length ? Math.round(right / mine.length * 100) : 0;
  const left = S.questions.filter(q => !mine.some(a => a.qid === q.id)).length;
  return `<div class="card hero"><div class="coin"><b class="pts" data-v="${right}">${counted ? right : 0}</b></div>
    <div><h2 style="margin:0">Hi ${esc(me.name.split(" ")[0])}, you have ${right} point${right === 1 ? "" : "s"}</h2>
    <div class="stats" style="margin-top:12px"><div><b>${mine.length}</b><span class="muted">answered</span></div><div><b>${acc}%</b><span class="muted">correct</span></div><div><b>${left}</b><span class="muted">new to answer</span></div></div></div></div>
    <div class="tabs"><button class="${tab === "new" ? "on" : ""}" onclick="setTab('new')">Answer questions</button><button class="${tab === "hist" ? "on" : ""}" onclick="setTab('hist')">My answers</button></div>
    ${tab === "new" ? qCard() : hist()}${board()}`;
}
function qCard() {
  if (last) {
    const q = S.questions.find(x => x.id === last.qid);
    if (q) return `<div class="card result"><div class="q">${esc(q.text)}</div>${q.opts.map((o, i) => `<div class="opt ${i === q.ans ? "ok" : i === last.pick ? "bad" : ""}"><i>${"ABCD"[i]}</i>${esc(o)}</div>`).join("")}
      <h3 style="margin-top:14px">${last.ok ? "Correct! +1 point" : "Not this time. The right answer is " + "ABCD"[q.ans] + "."}</h3><button class="btn" onclick="nextOne()">${nextQ() ? "Next question" : "Done"}</button></div>`;
  }
  const q = nextQ();
  if (!q) return `<div class="card"><h3>You are all caught up</h3><p class="muted">No new questions right now. This page checks for new ones automatically.</p></div>`;
  return `<div class="card"><p class="muted" style="margin-bottom:8px">Question by ${esc(uname(q.by))}</p><div class="q">${esc(q.text)}</div>
    ${q.opts.map((o, i) => `<button class="opt" onclick="pick(${i})"><i>${"ABCD"[i]}</i>${esc(o)}</button>`).join("")}
    <button class="btn" id="sub" disabled onclick="submitA()">Submit answer</button></div>`;
}
function hist() {
  const m = S.answers.filter(a => a.uid === me.id).sort((a, b) => b.ts - a.ts);
  return `<div class="card"><h3>Your answers</h3>${m.length ? m.map(a => {
    const q = S.questions.find(x => x.id === a.qid);
    return q ? `<div class="row"><span>${esc(q.text)}<br><span class="muted">You chose ${esc(q.opts[a.pick])}${a.ok ? "" : " · Correct: " + esc(q.opts[q.ans])}</span></span><b style="color:var(--${a.ok ? "mint" : "rose"})">${a.ok ? "+1" : "0"}</b></div>` : "";
  }).join("") : '<p class="muted">You have not answered anything yet.</p>'}</div>`;
}
function countUp() {
  const el = $(".pts"); if (!el || counted) return; counted = true;
  const v = +el.dataset.v; let n = 0;
  if (!v) return;
  const t = setInterval(() => { el.textContent = ++n; if (n >= v) clearInterval(t); }, Math.max(30, 700 / v));
}
function burst() {
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span"); s.className = "star"; s.textContent = i % 2 ? "⭐" : "✨";
    const a = Math.random() * 6.28, d = 90 + Math.random() * 130;
    s.style.setProperty("--x", Math.cos(a) * d + "px"); s.style.setProperty("--y", Math.sin(a) * d + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}

// ── ACTIONS ────────────────────────────────────────────────────────────
async function login(e) {
  e.preventDefault();
  try {
    await load();
    const n = $("#lu").value.trim().toLowerCase(), h = await hash($("#lp").value);
    const u = S.users.find(x => x.username.toLowerCase() === n && x.pass === h);
    if (!u) return toast(S.users.length ? "Wrong username or password." : "No users found. Check the database connection.");
    me = u; ses.set("qa_uid", u.id); counted = false; render();
  } catch (err) { toast("Login error: " + err.message); }
}
function logout() { me = null; last = null; sel = null; ses.del("qa_uid"); render(); }
async function addUser(e) {
  e.preventDefault(); await load();
  const username = $("#uu").value.trim();
  if (S.users.some(u => u.username.toLowerCase() === username.toLowerCase())) return toast("That username is taken.");
  S.users.push({ id: uid(), name: $("#un").value.trim(), username, pass: await hash($("#up").value), role: $("#ur").value });
  await save(); render(); toast("User created.");
}
async function setRole(id, r) { await load(); const u = S.users.find(x => x.id === id); if (u) u.role = r; await save(); render(); }
async function delUser(id) {
  if (!confirm("Delete this user and everything they created?")) return;
  await load();
  const qs = S.questions.filter(q => q.by === id).map(q => q.id);
  S.users = S.users.filter(u => u.id !== id); S.questions = S.questions.filter(q => q.by !== id);
  S.answers = S.answers.filter(a => a.uid !== id && !qs.includes(a.qid));
  await save(); render();
}
async function addQ(e) {
  e.preventDefault(); await load();
  S.questions.push({ id: uid(), by: me.id, text: $("#qt").value.trim(), opts: [0, 1, 2, 3].map(i => $("#o" + i).value.trim()), ans: +$("#qa").value, ts: Date.now() });
  await save(); render(); toast("Question published.");
}
async function delQ(id) {
  await load(); S.questions = S.questions.filter(q => q.id !== id); S.answers = S.answers.filter(a => a.qid !== id);
  await save(); render();
}
function setTab(t) { tab = t; last = null; render(); }
function pick(i) {
  sel = i;
  document.querySelectorAll(".opt").forEach((el, j) => el.classList.toggle("on", j === i));
  $("#sub").disabled = false;
}
async function submitA() {
  if (sel == null || busy) return; busy = true;
  await load();
  const q = nextQ(); if (!q) { busy = false; return render(); }
  const ok = sel === q.ans;
  S.answers.push({ uid: me.id, qid: q.id, pick: sel, ok, ts: Date.now() });
  await save();
  last = { qid: q.id, pick: sel, ok }; sel = null; busy = false; render();
  if (ok) burst();
}
function nextOne() { last = null; render(); }

// ── START ──────────────────────────────────────────────────────────────
(async function init() {
  const ok = await load();
  if (ok && !S.users.length) { // first run: default admin → change this password after login
    S.users.push({ id: uid(), name: "Admin", username: "admin", pass: await hash("admin123"), role: "admin" });
    await save();
  }
  const id = ses.get("qa_uid");
  me = S.users.find(u => u.id === id) || null;
  counted = false; render();
  // pick up new questions without a page refresh
  setInterval(async () => {
    if (!me || busy || sel != null || last) return;
    const before = JSON.stringify(S); await load();
    if (JSON.stringify(S) !== before && !document.activeElement.matches("input,textarea,select")) render();
  }, 6000);
})();
</script>
</body>
</html>
